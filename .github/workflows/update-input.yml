name: update flake input

on:
  workflow_dispatch:
    inputs:
      input:
        description: flake input name to update
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: update ${{ inputs.input }}
        run: nix flake update ${{ inputs.input }}

      - name: commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "flake: update ${{ inputs.input }}"
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      - uses: peter-evans/repository-dispatch@v3
        if: steps.push.outputs.pushed == 'true'
        with:
          token: ${{ secrets.NIX_REPO_PAT }}
          repository: xhos/nix
          event-type: deploy-mizore
